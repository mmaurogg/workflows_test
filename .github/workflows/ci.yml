name: My primera integracion

on:
    push:

jobs:
    hello:
        runs-on: ubuntu-latest

        steps:
              - name: Clone repository
                uses: actions/checkout@v6

              - name: Set up Flutter
                uses: subosito/flutter-action@v2
                with:
                    channel: stable
                    flutter-version: 3.35.0

              - name: Verificacion de la version de flutter
                run: bash ./scripts/check_flutter_version.sh

              - run: flutter pub get

              - name: Verificacion de formtato dart 
                run: dart format --output=none --set-exit-if-changed .

              - name: Analisis estatico
                run: flutter analyze

              - run: echo "Finalizando la integracion continua"