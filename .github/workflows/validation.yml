name: Validacion de codigo

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.0

      - name: Verificacion de la version de flutter
        run: bash ./scripts/check_flutter_version.sh

      - name: Verificar versión de Flutter
        run: bash ./scripts/check_flutter_version.sh

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificación de formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Ejecutar tests
        run: flutter test

      - run: echo "Finalizando la integracion continua"
